<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F131B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Keep opaque: translucent mode caused a 62px viewport jump on short
         pages in the iPhone Home Screen app. Existing installs needed reinstalling. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Sideout" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Sideout theme: dark (default) ↔ light, persisted per device.
      // Pre-paint before the stylesheet loads (no flash); keep theme-color in sync.
      (function () {
        var BG = { dark: '#0F131B', light: '#EEF0F4' };
        var ORDER = ['dark', 'light'];
        function apply(next) {
          if (next === 'dark') delete document.documentElement.dataset.theme;
          else document.documentElement.dataset.theme = next;
          document.documentElement.style.background = BG[next] || BG.dark;
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', BG[next] || BG.dark);
        }
        var stored = null;
        try { stored = localStorage.getItem('so_theme'); } catch (e) {}
        var initial = stored || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        if (ORDER.indexOf(initial) < 0) initial = 'dark';
        apply(initial);
        window.soTheme = {
          get: function () { return document.documentElement.dataset.theme || 'dark'; },
          set: function (next) {
            apply(next);
            try { localStorage.setItem('so_theme', next); } catch (e) {}
            window.dispatchEvent(new CustomEvent('so-theme', { detail: next }));
          },
          cycle: function () {
            var cur = window.soTheme.get();
            window.soTheme.set(ORDER[(ORDER.indexOf(cur) + 1) % ORDER.length]);
          }
        };
        window.addEventListener('storage', function (e) {
          if (e.key === 'so_theme' && e.newValue && e.newValue !== window.soTheme.get()) {
            apply(e.newValue);
            window.dispatchEvent(new CustomEvent('so-theme', { detail: e.newValue }));
          }
        });
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
