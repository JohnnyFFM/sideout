# CI + CD: every push and PR runs the tests and the web build. Pushes to
# `dev` deploy the test stack, pushes to `master` the live stack, but only
# when the VPS secrets exist (forks and plain clones just get CI).
name: ci-deploy

on:
  push:
    branches: [master, dev]
  pull_request:

concurrency:
  group: run-serialized-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web build + engine parity fixture
        working-directory: web
        run: |
          npm ci
          npm run fixture
          npm run build
      - name: cargo tests
        working-directory: server
        run: cargo test

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      stack: ${{ steps.meta.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - name: image name + stack from branch
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            echo "stack=live" >> "$GITHUB_OUTPUT"
          else
            echo "stack=test" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # path prefix for the SPA; repo variable SO_BASE (e.g. /sideout), empty for a domain
          build-args: |
            SO_BASE=${{ vars.SO_BASE }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.stack }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # dev always deploys the test stack; master deploys live only once the
    # repo variable LIVE_ENABLED is 'true' (i.e. a domain and Caddy site exist)
    if: github.event_name == 'push' && (github.ref_name == 'dev' || vars.LIVE_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: vps
    permissions:
      contents: read
      packages: read
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: skip without VPS secrets
        id: gate
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: ssh setup
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: sync stack
        if: steps.gate.outputs.skip != 'true'
        # the shared Caddy on the VPS belongs to the UnserPlan deploy; this
        # stack only syncs its own compose file
        run: |
          STACK='${{ needs.build.outputs.stack }}'
          DEST='${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}'
          ssh "$DEST" "mkdir -p /srv/sideout/$STACK"
          rsync -az deploy/$STACK/docker-compose.yml "$DEST:/srv/sideout/$STACK/"
      - name: pull + restart
        if: steps.gate.outputs.skip != 'true'
        run: |
          STACK='${{ needs.build.outputs.stack }}'
          ssh '${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}' "
            set -e
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            cd /srv/sideout/$STACK
            docker compose pull
            docker compose up -d
            docker image prune -f
          "
