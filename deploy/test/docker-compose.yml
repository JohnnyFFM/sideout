# test stack — /srv/sideout/test on the VPS
# .env: SO_IMAGE=ghcr.io/<owner>/sideout:test
name: sideout-test

services:
  app:
    image: ${SO_IMAGE:?set SO_IMAGE in .env, e.g. ghcr.io/<owner>/sideout:test}
    container_name: sideout-test
    restart: unless-stopped
    environment:
      - SO_SIGNUP=open
      - RUST_LOG=sideout_server=info
      # must match the SO_BASE the image was built with (repo variable
      # SO_BASE_TEST); set in .env, empty for a domain
      - SO_BASE=${SO_BASE:-}
    volumes:
      - ./data:/data
    networks:
      - web

networks:
  web:
    external: true
